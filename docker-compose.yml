version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./:/usr/app
      - /usr/app/node_modules
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=patitas_db
      - DB_PORT=5432
    depends_on:
      - db
    # Comando para desarrollo con recarga automática
    command: npm run dev

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patitas_db
    ports:
      - "5432:5432"
    volumes:
      - patitas_pgdata:/var/lib/postgresql/data

volumes:
  patitas_pgdata: