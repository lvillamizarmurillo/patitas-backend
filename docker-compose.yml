services:
  app:
    build:
      context: .
      target: development
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DB_HOST: db          # sobrescribe el localhost del .env
      DB_PORT: 5432
    volumes:
      - .:/usr/app
      - /usr/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm run migrate && npm run dev"

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - patitas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  patitas_pgdata: